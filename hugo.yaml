baseURL: "https://dudusoar.github.io/"
languageCode: "en-us"
title: "Yuchen Du"
theme: "PaperMod"

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: production
  description: "Yuchen Du's research papers, projects, technical writing, and photo field notes."
  author: "Yuchen Du"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowToc: true

  homeInfoParams:
    Title: "Hi, I'm Yuchen"
    Content: "I work on AI-driven optimization, LLM reasoning systems, and transportation simulation."

  socialIcons:
    - name: github
      url: "https://github.com/dudusoar"
    - name: linkedin
      url: "https://www.linkedin.com/in/yuchen-du-/"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=E_3P15cAAAAJ"
    - name: email
      url: "mailto:du313@purdue.edu"
    - name: cv
      url: "/cv/"

menu:
  main:
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 10
    - identifier: papers
      name: Papers
      url: /papers/
      weight: 30
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 40
    - identifier: photos
      name: Photos
      url: /photos/
      weight: 50
    - identifier: about
      name: About
      url: /about/
      weight: 60
