<script>
    document.addEventListener("DOMContentLoaded", function () {
        const modal = document.getElementById("email-modal");
        if (!modal) return;

        const address = document.getElementById("email-modal-address");
        const status = modal.querySelector("[data-email-copy-status]");
        const openButtons = document.querySelectorAll("[data-email-modal-open]");
        const closeButtons = modal.querySelectorAll("[data-email-modal-close]");
        const copyButton = modal.querySelector("[data-email-copy]");

        function openModal(email) {
            if (email && address) address.textContent = email;
            if (status) status.textContent = "";
            modal.setAttribute("aria-hidden", "false");
            document.body.classList.add("email-modal-open");
            if (copyButton) copyButton.focus();
        }

        function closeModal() {
            modal.setAttribute("aria-hidden", "true");
            document.body.classList.remove("email-modal-open");
        }

        async function copyEmail() {
            const email = address ? address.textContent.trim() : "";
            if (!email) return;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(email);
                } else {
                    const input = document.createElement("textarea");
                    input.value = email;
                    input.setAttribute("readonly", "");
                    input.style.position = "fixed";
                    input.style.opacity = "0";
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand("copy");
                    document.body.removeChild(input);
                }
                if (status) status.textContent = "Copied.";
            } catch (error) {
                if (status) status.textContent = "Copy failed. Please select the address manually.";
            }
        }

        openButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                openModal(button.getAttribute("data-email"));
            });
        });

        closeButtons.forEach(function (button) {
            button.addEventListener("click", closeModal);
        });

        if (copyButton) copyButton.addEventListener("click", copyEmail);

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && modal.getAttribute("aria-hidden") === "false") {
                closeModal();
            }
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const links = Array.from(document.querySelectorAll(".photo-album .photo-frame"));
        if (!links.length) return;

        const lightbox = document.createElement("div");
        lightbox.className = "photo-lightbox";
        lightbox.hidden = true;
        lightbox.innerHTML = [
            '<button type="button" class="photo-lightbox__close" aria-label="Close photo">x</button>',
            '<button type="button" class="photo-lightbox__prev" aria-label="Previous photo">&lt;</button>',
            '<img alt="">',
            '<button type="button" class="photo-lightbox__next" aria-label="Next photo">&gt;</button>'
        ].join("");
        document.body.appendChild(lightbox);

        const image = lightbox.querySelector("img");
        const closeButton = lightbox.querySelector(".photo-lightbox__close");
        const prevButton = lightbox.querySelector(".photo-lightbox__prev");
        const nextButton = lightbox.querySelector(".photo-lightbox__next");
        let currentIndex = 0;

        function show(index) {
            currentIndex = (index + links.length) % links.length;
            const link = links[currentIndex];
            const thumb = link.querySelector("img");
            image.src = link.href;
            image.alt = thumb ? thumb.alt : "";
            lightbox.hidden = false;
            document.body.style.overflow = "hidden";
        }

        function close() {
            lightbox.hidden = true;
            image.removeAttribute("src");
            document.body.style.overflow = "";
        }

        links.forEach(function (link, index) {
            link.addEventListener("click", function (event) {
                event.preventDefault();
                show(index);
            });
        });

        closeButton.addEventListener("click", close);
        prevButton.addEventListener("click", function () { show(currentIndex - 1); });
        nextButton.addEventListener("click", function () { show(currentIndex + 1); });
        lightbox.addEventListener("click", function (event) {
            if (event.target === lightbox) close();
        });

        document.addEventListener("keydown", function (event) {
            if (lightbox.hidden) return;
            if (event.key === "Escape") close();
            if (event.key === "ArrowLeft") show(currentIndex - 1);
            if (event.key === "ArrowRight") show(currentIndex + 1);
        });
    });
</script>
