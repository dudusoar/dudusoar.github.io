{{- if .Params.math }}
<!-- KaTeX CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<!-- KaTeX JS -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<!-- KaTeX auto-render extension -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRjXlZlYVhNRwVyU" crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false,
            strict: false
        });
    });
</script>
{{- end }}

{{- if .Params.photoAlbum }}
<style>
  .photo-collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 28px;
  }

  .photo-collection-card {
    display: block;
    overflow: hidden;
    border-radius: 0;
    color: var(--primary);
    text-decoration: none;
    background: transparent;
  }

  .photo-collection-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  .photo-collection-card span {
    display: block;
    padding: 10px 0 0;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .photo-album {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    align-items: start;
    gap: 10px;
    margin-top: 22px;
  }

  .photo-frame {
    display: block;
    background: transparent;
  }

  .photo-frame img {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
  }

  .photo-frame:hover img {
    filter: brightness(1.04);
  }

  .photo-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 58px;
    background: rgba(0, 0, 0, 0.92);
  }

  .photo-lightbox[hidden] {
    display: none;
  }

  .photo-lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .photo-lightbox button {
    position: absolute;
    border: 0;
    color: #fff;
    background: rgba(0, 0, 0, 0.35);
    cursor: pointer;
    line-height: 1;
  }

  .photo-lightbox__close {
    top: 14px;
    right: 16px;
    width: 40px;
    height: 40px;
    font-size: 30px;
  }

  .photo-lightbox__prev,
  .photo-lightbox__next {
    top: 50%;
    width: 48px;
    height: 64px;
    transform: translateY(-50%);
    font-size: 42px;
  }

  .photo-lightbox__prev {
    left: 8px;
  }

  .photo-lightbox__next {
    right: 8px;
  }

  .photo-lightbox button:hover,
  .photo-lightbox button:focus {
    background: rgba(255, 255, 255, 0.18);
    outline: none;
  }

  @media (max-width: 640px) {
    .photo-album {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-lightbox {
      padding: 24px 44px;
    }
  }
</style>
{{- end }}
