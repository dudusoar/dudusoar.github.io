{{- if .Params.math }}
<!-- KaTeX CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<!-- KaTeX JS -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<!-- KaTeX auto-render extension -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRjXlZlYVhNRwVyU" crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false,
            strict: false
        });
    });
</script>
{{- end }}

{{- if .Params.photoAlbum }}
<style>
  .photo-collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 28px;
  }

  .photo-collection-card {
    display: block;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--primary);
    text-decoration: none;
    background: var(--entry);
  }

  .photo-collection-card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .photo-collection-card span {
    display: block;
    padding: 12px 14px 14px;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .photo-album {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-top: 22px;
  }

  .photo-frame {
    display: block;
    overflow: hidden;
    border-radius: 6px;
    background: var(--tertiary);
  }

  .photo-frame-featured {
    grid-column: 1 / -1;
  }

  .photo-frame img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    transition: transform 180ms ease, filter 180ms ease;
  }

  .photo-frame-featured img {
    aspect-ratio: 16 / 9;
  }

  .photo-frame:hover img {
    transform: scale(1.015);
    filter: brightness(1.03);
  }

  @media (max-width: 640px) {
    .photo-album {
      grid-template-columns: 1fr;
    }

    .photo-frame-featured img {
      aspect-ratio: 4 / 3;
    }
  }
</style>
{{- end }}
