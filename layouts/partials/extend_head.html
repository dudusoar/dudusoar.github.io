{{- with site.Params.analytics.plausible }}
{{- if and (eq hugo.Environment "production") .domain }}
<script defer data-domain="{{ .domain }}" src="{{ .script | default "https://plausible.io/js/script.js" }}"></script>
{{- end }}
{{- end }}

{{- if .Params.math }}
<!-- KaTeX CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<!-- KaTeX JS -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<!-- KaTeX auto-render extension -->
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRjXlZlYVhNRwVyU" crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false,
            strict: false
        });
    });
</script>
{{- end }}

{{- if or .Params.photoAlbum (eq .Section "photos") }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css">
<style>
  .main {
    max-width: min(1560px, calc(100vw - 32px));
    padding-inline: 16px;
  }

  .photos-shell {
    width: 100%;
    margin: 0 auto;
  }

  .photos-header {
    max-width: 840px;
    margin: 0 0 28px;
  }

  .photos-back {
    display: inline-flex;
    margin-bottom: 12px;
    color: var(--secondary);
    font-size: 16px;
    line-height: 1.4;
  }

  .photos-back:hover {
    color: var(--primary);
    box-shadow: 0 1px 0 currentColor;
  }

  .photos-header h1 {
    margin: 8px 0 10px;
    font-size: 42px;
    line-height: 1.1;
  }

  .photos-description,
  .photos-intro {
    color: var(--secondary);
    font-size: 16px;
    line-height: 1.65;
  }

  .photos-intro p {
    margin: 0;
  }

  .photos-collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
    margin-top: 28px;
  }

  .photos-collection-card {
    display: block;
    overflow: hidden;
    border-radius: 0;
    color: var(--primary);
    text-decoration: none;
    background: transparent;
  }

  .photos-collection-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  .photos-collection-card span {
    display: block;
    padding: 10px 0 0;
    font-size: 1.05rem;
    font-weight: 600;
  }

  .photos-masonry {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
  }

  .photo-tile {
    display: block;
    flex: 0 0 auto;
    background: transparent;
    overflow: hidden;
  }

  .photo-tile img {
    display: block;
    width: auto;
    max-width: 100%;
    height: clamp(190px, 17vw, 265px);
    cursor: zoom-in;
  }

  .photos-masonry.is-justified .photo-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-tile:hover img,
  .photos-collection-card:hover img {
    filter: brightness(1.035);
  }

  @media (max-width: 1100px) {
    .photo-tile img {
      height: clamp(160px, 24vw, 225px);
    }
  }

  @media (max-width: 760px) {
    .main {
      max-width: 100%;
      padding-inline: 12px;
    }

    .photos-header h1 {
      font-size: 34px;
    }

    .photos-masonry {
      gap: 6px;
    }

    .photo-tile img {
      height: clamp(118px, 34vw, 168px);
    }
  }
</style>
{{- end }}
